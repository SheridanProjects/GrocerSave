# 2. FRONTEND
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: grocersave-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: grocersave/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          value: "test"
        - name: AWS_SECRET_ACCESS_KEY
          value: "test"
        - name: AWS_XRAY_DAEMON_ADDRESS
          value: "127.0.0.1:2000"
      - name: xray-daemon
        image: amazon/aws-xray-daemon:3.x
        command: ["/xray", "-c", "/etc/xray/xray-daemon.yaml"]
        ports:
          - containerPort: 2000
            protocol: UDP
        env:
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          value: "test"
        - name: AWS_SECRET_ACCESS_KEY
          value: "test"
        volumeMounts:
          - name: xray-config-volume
            mountPath: /etc/xray
            readOnly: true
      volumes:
        - name: xray-config-volume
          configMap:
            name: xray-daemon-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: grocersave-dev
spec:
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: frontend
