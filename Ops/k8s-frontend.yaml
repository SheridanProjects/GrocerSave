# 2. FRONTEND
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: grocersave-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: grocersave/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        # This is the crucial part. We tell the container where the API is.
        # In this case, it's the Nginx proxy service.
        - name: REACT_APP_API_URL
          value: "http://nginx-proxy:80"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: grocersave-dev
spec:
  ports:
  - port: 80
  selector:
    app: frontend