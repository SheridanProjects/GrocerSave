# 1. NGINX PROXY (Ingress Controller)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: grocersave-dev
data:
  grocersave.conf: |
    upstream bff_backend { 
      server bff-service:3100; 
    }
    upstream frontend { 
      server frontend:5000; 
    }
    
    server {
      listen 80;
      
      location /api/ {
        proxy_pass http://bff_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
      
      location / {
        proxy_pass http://frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-proxy
  namespace: grocersave-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      containers:
      - name: nginx-proxy
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d/grocersave.conf
          subPath: grocersave.conf
      volumes:
      - name: config-volume
        configMap:
          name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy
  namespace: grocersave-dev
spec:
  type: NodePort
  ports:
  - port: 80
    nodePort: 31000
  selector:
    app: nginx-proxy