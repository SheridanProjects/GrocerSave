# 2. POSTGRES (Catalog/Auth DB)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: grocersave-dev
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "grocer_admin"
        - name: POSTGRES_PASSWORD
          value: "dev_secret_123"
        - name: POSTGRES_DB
          value: "grocersave_db"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: grocersave-dev
spec:
  ports:
  - port: 5432
  selector:
    app: postgres