# 3. BFF SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-service
  namespace: grocersave-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-service
  template:
    metadata:
      labels:
        app: bff-service
    spec:
      # This is the crucial fix. We are explicitly telling this pod
      # how to resolve DNS names within the cluster.
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          # This is the standard address for the CoreDNS service within a Kubernetes cluster.
          - 10.100.0.10
        searches:
          # This tells the pod to automatically search for services in its own namespace
          # and then in the default cluster domain.
          - grocersave-dev.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"

      containers:
      - name: bff-service
        image: grocersave/bff-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3100
        env:
        - name: PORT
          value: "3100"
        - name: AUTH_URL
          value: "http://auth-service:8180"
        - name: CATALOG_URL
          value: "http://catalog-service:8181"
        - name: PRICE_URL
          value: "http://price-service:8182"
---
apiVersion: v1
kind: Service
metadata:
  name: bff-service
  namespace: grocersave-dev
spec:
  ports:
  - port: 3100
  selector:
    app: bff-service