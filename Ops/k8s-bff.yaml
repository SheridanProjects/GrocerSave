# 3. BFF SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-service
  namespace: grocersave-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-service
  template:
    metadata:
      labels:
        app: bff-service
    spec:
      # The incorrect dnsConfig has been removed.
      # The pod will now use the default cluster DNS settings.
      containers:
      - name: bff-service
        image: grocersave/bff-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3100
        env:
        - name: PORT
          value: "3100"
        - name: AUTH_URL
          value: "http://auth-service:8180"
        - name: CATALOG_URL
          value: "http://catalog-service:8181"
        - name: PRICE_URL
          value: "http://price-service:8182"
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: resend-creds
              key: RESEND_API_KEY
        - name: RESEND_FROM
          value: "onboarding@grocersave.app"
        - name: RESEND_WELCOME_TEMPLATE_ID
          value: "welcome"
---
apiVersion: v1
kind: Service
metadata:
  name: bff-service
  namespace: grocersave-dev
spec:
  ports:
  - port: 3100
  selector:
    app: bff-service