# CATALOG SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: grocersave-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
      - name: catalog-service
        image: grocersave/catalog-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8181
        env:
        - name: PORT
          value: "8181"
        - name: DB_HOST
          value: "postgres"
        - name: ELASTIC_HOST
          value: "elasticsearch:9200"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-creds
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-creds
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "postgres" # Hardcode to the correct database
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: grocersave-dev
spec:
  ports:
  - port: 8181
  selector:
    app: catalog-service
