# AUTH SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: grocersave-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      # Applying the DNS fix to the auth service for consistency
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 10.100.0.10
        searches:
          - grocersave-dev.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"

      containers:
      - name: auth-service
        image: grocersave/auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8180
        env:
        - name: PORT
          value: "8180"
        - name: DB_HOST
          value: "postgres"
        - name: POSTGRES_USER
          value: "grocer_admin"
        - name: POSTGRES_PASSWORD
          value: "dev_secret_123"
        - name: POSTGRES_DB
          value: "grocersave_db"
        - name: REDIS_HOST # Added for completeness
          value: "redis"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: grocersave-dev
spec:
  ports:
  - port: 8180
  selector:
    app: auth-service