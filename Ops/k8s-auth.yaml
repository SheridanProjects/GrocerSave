# AUTH SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: grocersave-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: grocersave/auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8180
        env:
        - name: PORT
          value: "8180"
        - name: DB_HOST
          value: "postgres"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-creds
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-creds
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-creds
              key: POSTGRES_DB
        - name: REDIS_HOST
          value: "redis"
        - name: AWS_XRAY_DAEMON_ADDRESS
          value: "127.0.0.1:2000"
      - name: xray-daemon
        image: amazon/aws-xray-daemon:3.x
        command: ["/xray", "-c", "/etc/xray/xray-daemon.yaml"]
        ports:
          - containerPort: 2000
            protocol: UDP
        env:
          - name: AWS_REGION
            value: "us-east-1"
          - name: AWS_ACCESS_KEY_ID
            value: "test"
          - name: AWS_SECRET_ACCESS_KEY
            value: "test"
        volumeMounts:
          - name: xray-config-volume
            mountPath: /etc/xray
            readOnly: true
      volumes:
        - name: xray-config-volume
          configMap:
            name: xray-daemon-config
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: grocersave-dev
spec:
  ports:
  - port: 8180
  selector:
    app: auth-service
