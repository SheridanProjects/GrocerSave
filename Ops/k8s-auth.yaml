# AUTH SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: grocersave-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      # The incorrect dnsConfig has been removed.
      containers:
      - name: auth-service
        image: grocersave/auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8180
        env:
        - name: PORT
          value: "8180"
        - name: DB_HOST
          value: "postgres"
        - name: POSTGRES_USER
          value: "grocer_admin"
        - name: POSTGRES_PASSWORD
          value: "dev_secret_123"
        - name: POSTGRES_DB
          value: "grocersave_db"
        - name: REDIS_HOST
          value: "redis"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: grocersave-dev
spec:
  ports:
  - port: 8180
  selector:
    app: auth-service