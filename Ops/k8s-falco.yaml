apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: grocersave-dev
  labels:
    app: falco
spec:
  selector:
    matchLabels:
      app: falco
  template:
    metadata:
      labels:
        app: falco
    spec:
      serviceAccountName: falco
      containers:
        - name: falco
          image: falcosecurity/falco:latest
          securityContext:
            privileged: true # Required for eBPF/kernel tracing
          args:
            - /usr/bin/falco
            - -o
            - json_output=true
          volumeMounts:
            - mountPath: /var/run/docker.sock
              name: docker-socket
            - mountPath: /host/dev
              name: dev-fs
              readOnly: true
            - mountPath: /host/proc
              name: proc-fs
              readOnly: true
            - mountPath: /host/etc
              name: etc-fs
              readOnly: true
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
        - name: dev-fs
          hostPath:
            path: /dev
        - name: proc-fs
          hostPath:
            path: /proc
        - name: etc-fs
          hostPath:
            path: /etc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco
  namespace: grocersave-dev
---
# RBAC roles omitted for brevity, but Falco needs cluster read access