# This is the Nginx configuration for the frontend container.
# Its job is to serve the static React files and proxy API calls.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Handle client-side routing for the React app
  location / {
    try_files $uri /index.html;
  }

  # This is the crucial part.
  # Any request starting with /api/ will be proxied to the main Nginx proxy service.
  # We use the full Kubernetes internal DNS name for robustness.
  location /api/ {
    # Use the internal Kubernetes DNS resolver
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;

    # The service name is 'nginx-proxy' in the 'grocersave-dev' namespace.
    # The FQDN is <service-name>.<namespace>.svc.cluster.local
    set $api_backend "http://nginx-proxy.grocersave-dev.svc.cluster.local";

    proxy_pass $api_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
