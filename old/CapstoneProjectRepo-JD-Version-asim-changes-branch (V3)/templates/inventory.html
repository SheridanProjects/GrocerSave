{% extends "base.html" %}
{% block content %}
<h2>Inventory</h2>

<table class="table table-striped table-bordered mt-3">
    <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Quantity</th>
            <th>Price ($)</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item['name'] }}</td>
            <td>{{ item['quantity'] }}</td>
            <td>{{ item['price'] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a href="{{ url_for('enter_data') }}" class="btn btn-primary">Add Item</a>
<a href="{{ url_for('userMain') }}" class="btn btn-dark">Dashboard</a>
{% endblock %}
